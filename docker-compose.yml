services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"
    volumes:
      - pipelinepulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      ENABLE_LIVE_PRICING: ${ENABLE_LIVE_PRICING:-false}
      AWS_PRICING_BASE_URL: ${AWS_PRICING_BASE_URL:-}
      AZURE_RETAIL_PRICES_URL: ${AZURE_RETAIL_PRICES_URL:-}
      PRICING_CACHE_TTL_SECONDS: ${PRICING_CACHE_TTL_SECONDS:-21600}
      CARBON_CACHE_TTL_SECONDS: ${CARBON_CACHE_TTL_SECONDS:-86400}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-http}
      PORT: ${BACKEND_PORT:-5000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      - "${BACKEND_HOST_PORT:-5000}:${BACKEND_PORT:-5000}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE: ${FRONTEND_API_BASE:-/api}
      BACKEND_UPSTREAM: ${FRONTEND_BACKEND_UPSTREAM:?FRONTEND_BACKEND_UPSTREAM is required}
      NGINX_PORT: ${FRONTEND_CONTAINER_PORT:-80}
      API_PROXY_PATH: ${FRONTEND_API_PROXY_PATH:-/api/}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-60s}
      STATIC_CACHE_CONTROL: ${STATIC_CACHE_CONTROL:-no-store, no-cache, must-revalidate, max-age=0}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:${FRONTEND_CONTAINER_PORT:-80}"
    depends_on:
      - backend

volumes:
  pipelinepulse_pgdata:
